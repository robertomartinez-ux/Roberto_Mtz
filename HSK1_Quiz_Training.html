<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK 1 – Quiz</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  display: flex;
  justify-content: center;
  align-items: center;

  margin: 0;
}
.card {

  border-radius: 12px;

}

  width: 100%;
  padding: 14px;
  margin: 8px 0;
  font-size: 16px;
  cursor: pointer;
  border-radius: 8px;
}
.correct { background:#4CAF50; color:white; }
.wrong { background:#F44336; color:white; }
.char { font-size: 56px; }
.pinyin { color:#555; margin-bottom:10px; }
input {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  font-size: 16px;
  border-radius: 8px;
  border: 2px solid #ddd;
  box-sizing: border-box;
}

input:focus {
  outline: none;
  border-color: #6c63ff;
}

#nameScreen h3 {
  margin-bottom: 12px;
}
.primary {
  background: #6c63ff;
  color: white;
  border: none;
}
  
</style>
</head>

<body>

<!-- MENU -->
<div class="card" id="menu">
  <h2>HSK 1</h2>

  <h3>🏆 Ranking</h3>
  <ul id="ranking" style="list-style:none;padding:0"></ul>
  <hr>

  <button onclick="startGame()">🎮 Juego</button>
  <button onclick="chooseSurvival()">🔥 Supervivencia</button>
  <button onclick="chooseHard()">💀 HARD</button>
</div>

<!-- PEDIR NOMBRE -->
<div class="card" id="nameScreen" style="display:none">
  <h3>🧑 Tu nombre</h3>
<input
  id="playerName"
  placeholder="Escribe tu nombre"
  maxlength="12"
  autofocus
  style="width:100%;padding:12px;border-radius:8px;margin-bottom:10px">


  <button class="primary" onclick="confirmName()">Comenzar</button>
  <button onclick="backToMenu()">Cancelar</button>
</div>

<!-- GAME -->
<div class="card" id="game" style="display:none">
  <div id="modeLabel"></div>
  <div id="lives"></div>
  <div id="score">Score: <strong>0</strong></div>

  <div class="char" id="char"></div>
  <div class="pinyin" id="pinyin"></div>

  <div id="options"></div>
  <div id="feedback"></div>

  <button id="exitBtn" onclick="backToMenu()" style="display:none">Salir</button>
</div>

<script type="module">
/* 🔥 FIREBASE */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, query, orderBy, limit,
  getDocs, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey:,
  authDomain: "hsk1quiz.firebaseapp.com",
  projectId: "hsk1quiz",
  storageBucket: "hsk1quiz.firebasestorage.app",
  messagingSenderId: "914453916513",
  appId: "1:914453916513:web:fd0a68a4773c64c1f7f320"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* 🏆 RANKING */
async function loadRanking() {
  const q = query(
    collection(db, "scores"),
    orderBy("score", "desc"),
    limit(3)
  );

  const snapshot = await getDocs(q);
  const ranking = document.getElementById("ranking");
  ranking.innerHTML = "";

  if (snapshot.empty) {
    ranking.innerHTML = "<li>Sin registros aún</li>";
    return;
  }

  const medals = ["🥇","🥈","🥉"];
  let pos = 0;

  snapshot.forEach(doc => {
    const { name, score } = doc.data();
    ranking.innerHTML += `<li>${medals[pos]} ${name} - ${score}</li>`;
    pos++;
  });
}


loadRanking();

/* ESTADO */
let playerName = "";
let mode = "";
let pendingMode = "";
let lives = 3;
let score = 0;
let current;
let usedWords = [];

const words = [
  {c:"爱",p:"ài",m:"amar"},{c:"八",p:"bā",m:"ocho"},{c:"爸爸",p:"bàba",m:"papá"}, {c:"杯子",p:"bēizi",m:"vaso"},{c:"北京",p:"Běijīng",m:"Pekín"}, {c:"本",p:"běn",m:"libro / cuaderno"},{c:"不",p:"bù",m:"no"}, {c:"不客气",p:"bú kèqi",m:"de nada"},{c:"菜",p:"cài",m:"platillo"}, {c:"茶",p:"chá",m:"té"},{c:"吃",p:"chī",m:"comer"}, {c:"出租车",p:"chūzūchē",m:"taxi"},{c:"打电话",p:"dǎ diànhuà",m:"llamar"}, {c:"大",p:"dà",m:"grande"},{c:"的",p:"de",m:"posesivo"}, {c:"点",p:"diǎn",m:"hora / punto"},{c:"电脑",p:"diànnǎo",m:"computadora"}, {c:"电视",p:"diànshì",m:"televisión"},{c:"电影",p:"diànyǐng",m:"película"}, {c:"东西",p:"dōngxi",m:"cosa"},{c:"都",p:"dōu",m:"todos"}, {c:"读",p:"dú",m:"leer"},{c:"对不起",p:"duìbuqǐ",m:"lo siento"}, {c:"多",p:"duō",m:"mucho"},{c:"多少",p:"duōshao",m:"cuánto"}, {c:"儿子",p:"érzi",m:"hijo"},{c:"二",p:"èr",m:"dos"}, {c:"饭店",p:"fàndiàn",m:"restaurante"},{c:"飞机",p:"fēijī",m:"avión"}, {c:"分钟",p:"fēnzhōng",m:"minuto"},{c:"高兴",p:"gāoxìng",m:"feliz"}, {c:"个",p:"gè",m:"clasificador"},{c:"工作",p:"gōngzuò",m:"trabajo"}, {c:"狗",p:"gǒu",m:"perro"},{c:"汉语",p:"Hànyǔ",m:"chino"}, {c:"好",p:"hǎo",m:"bueno"},{c:"号",p:"hào",m:"número"}, {c:"喝",p:"hē",m:"beber"},{c:"和",p:"hé",m:"y"}, {c:"很",p:"hěn",m:"muy"},{c:"后面",p:"hòumian",m:"detrás"}, {c:"回",p:"huí",m:"volver"},{c:"会",p:"huì",m:"saber / poder"}, {c:"火车站",p:"huǒchēzhàn",m:"estación de tren"}, {c:"几",p:"jǐ",m:"cuántos"},{c:"家",p:"jiā",m:"casa"}, {c:"叫",p:"jiào",m:"llamarse"},{c:"今天",p:"jīntiān",m:"hoy"}, {c:"九",p:"jiǔ",m:"nueve"},{c:"开",p:"kāi",m:"abrir"}, {c:"看",p:"kàn",m:"ver"},{c:"看见",p:"kànjiàn",m:"ver (lograr ver)"}, {c:"块",p:"kuài",m:"moneda"},{c:"来",p:"lái",m:"venir"}, {c:"老师",p:"lǎoshī",m:"maestro"},{c:"了",p:"le",m:"partícula"}, {c:"冷",p:"lěng",m:"frío"},{c:"里",p:"lǐ",m:"dentro"}, {c:"六",p:"liù",m:"seis"},{c:"妈妈",p:"māma",m:"mamá"}, {c:"吗",p:"ma",m:"pregunta"},{c:"买",p:"mǎi",m:"comprar"}, {c:"猫",p:"māo",m:"gato"},{c:"没",p:"méi",m:"no (pasado)"}, {c:"没关系",p:"méi guānxi",m:"no pasa nada"}, {c:"米饭",p:"mǐfàn",m:"arroz"},{c:"名字",p:"míngzi",m:"nombre" hospital"}, {c:"椅子",p:"yǐzi",m:"silla"},{c:"有",p:"yǒu",m:"tener"}, {c:"月",p:"yuè",m:"mes"},{c:"再见",p:"zàijiàn",m:"adiós"}, {c:"在",p:"zài",m:"estar en"},{c:"怎么",p:"zěnme",m:"cómo"}, {c:"怎么样",p:"zěnmeyàng",m:"qué tal"}, {c:"这",p:"zhè",m:"este"},{c:"这儿",p:"zhèr",m:"aquí"}, {c:"中国",p:"Zhōngguó",m:"China"},{c:"中午",p:"zhōngwǔ",m:"mediodía"}, {c:"住",p:"zhù",m:"vivir"},{c:"桌子",p:"zhuōzi",m:"mesa"}, {c:"字",p:"zì",m:"carácter"},{c:"昨天",p:"zuótiān",m:"ayer"},{c:"5:30",p:"Wǔ diǎn bàn",m:"五点半"} ];

/* SAVE SCORE */
async function saveScore() {
  if (!playerName || score <= 0) return;

  await addDoc(collection(db,"scores"), {
    name: playerName,
    score: score,
    createdAt: serverTimestamp()
  });
}

/* MENU ACTIONS */
window.startGame = () => {
  mode = "game";
  score = 0;
  lives = 0;
  livesEl.innerText = "";

  menu.style.display = "none";
  game.style.display = "block";
  modeLabel.innerText = "🎮 Juego";
  livesEl.innerText = "";
  scoreEl.innerHTML = "Score: <strong>0</strong>";
  loadWord();
};

window.chooseSurvival = () => {
  pendingMode = "survival";
  menu.style.display = "none";
  nameScreen.style.display = "block";
};

window.chooseHard = () => {
  pendingMode = "hard";
  menu.style.display = "none";
  nameScreen.style.display = "block";
};

window.confirmName = () => {
  const n = playerNameInput.value.trim();
  if (!n) { alert("Escribe tu nombre 🙂"); return; }

  playerName = n;
  nameScreen.style.display = "none";

  usedWords = [];

  mode = "survival";
  lives = 3;
  score = 0;

  game.style.display = "block";
  modeLabel.innerText = pendingMode === "hard" ? "💀 HARD" : "🔥 Supervivencia";
  livesEl.innerText = "❤️❤️❤️";
  scoreEl.innerHTML = "Score: <strong>0</strong>";

  loadWord();
};

/* GAME */
function loadWord() {

  // 🏁 Si ya no hay palabras disponibles
  if (mode === "survival" && usedWords.length === words.length) {
    alert("🏆 ¡Completaste todas las palabras!");
    saveScore();
    backToMenu();
    return;
  }

  let availableWords = words;

  if (mode === "survival") {
    availableWords = words.filter(w => !usedWords.includes(w));
  }

  current = availableWords[Math.floor(Math.random() * availableWords.length)];

  if (mode === "survival") {
    usedWords.push(current);

    // contador bonito
    modeLabel.innerText =
      (pendingMode === "hard" ? "💀 HARD" : "🔥 Supervivencia") +
      ` (${usedWords.length}/${words.length})`;
  }

  char.innerText = current.c;
  pinyin.innerText = pendingMode === "hard" ? "" : current.p;

  options.innerHTML = "";

  const answers = [
    current.m,
    ...words
      .filter(w => w.m !== current.m)
      .sort(() => 0.5 - Math.random())
      .slice(0, 3)
      .map(w => w.m)
  ].sort(() => 0.5 - Math.random());

  answers.forEach(ans => {
    const btn = document.createElement("button");
    btn.innerText = ans;
    btn.onclick = () => check(ans, btn);
    options.appendChild(btn);
  });
}



function check(ans,btn) {
  if (ans === current.m) {
    btn.className = "correct";
    score++;
  } else {
    btn.className = "wrong";
    lives--;
  }

  scoreEl.innerHTML = `Score: <strong>${score}</strong>`;
  if (mode === "survival") {
  livesEl.innerText = "❤️".repeat(lives);

if (mode !== "game" && lives === 0) {
  saveScore();
  setTimeout(() => {
    backToMenu();   // 🔥 vuelve al menú y recarga ranking
  }, 800);
  return;
}
  }
  setTimeout(loadWord, 800);
}

/* BACK */
window.backToMenu = () => {
  game.style.display = "none";
  nameScreen.style.display = "none";
  menu.style.display = "block";
  exitBtn.style.display = "none";
  loadRanking();
};

/* DOM */
const menu = document.getElementById("menu");
const nameScreen = document.getElementById("nameScreen");
const game = document.getElementById("game");
const ranking = document.getElementById("ranking");
const char = document.getElementById("char");
const pinyin = document.getElementById("pinyin");
const options = document.getElementById("options");
const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const modeLabel = document.getElementById("modeLabel");
const exitBtn = document.getElementById("exitBtn");
const playerNameInput = document.getElementById("playerName");
playerNameInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    confirmName();
  }
});
</script>

</body>
